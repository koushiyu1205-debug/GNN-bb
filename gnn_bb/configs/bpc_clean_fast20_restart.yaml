# 中文摘要：20 规模 tailing-off 诊断配置。基于 bpc_clean 主线，关闭已知会拖慢
# bench_20_01 的 weighted/task-level separator，只启用 exact-safe 节点局部 route-pool restart。

python: /home/kai/miniconda3/envs/ecole/bin/python
instances: ["bench_20_01"]
time_limit: 1800
random_seed: 20260511
instance_dir: json/instances
results_csv: results/bpc_clean_fast20_restart.csv
log_dir: results/logs/bpc_clean_fast20_restart
solution_dir: results/solutions/bpc_clean_fast20_restart
log_level: progress

pricing_eps: 1.0e-6
integer_tol: 1.0e-6
max_nodes: 100000
max_routes_per_pricing: 500
root_max_routes_per_pricing: 1200
max_labels_per_pricing: 0

heuristic_pricing_enabled: true
heuristic_pricing_max_labels: 120000
heuristic_pricing_routes_per_round: 600
heuristic_pricing_selection_mode: diverse
exact_pricing_selection_mode: diverse
branch_node_heuristic_boost_enabled: true
branch_node_heuristic_boost_max_labels: 900000
branch_node_heuristic_boost_routes_per_round: 1000
branch_node_heuristic_boost_min_depth: 1
exact_pricing_dominance_enabled: true

pricing_completion_bound_enabled: false
ng_dssr_pricing_enabled: false
ng_dssr_memory_size: 6
exact_dssr_pricing_enabled: false
exact_dssr_initial_memory_size: 6
exact_dssr_max_iterations: 4
exact_dssr_max_labels: 2500000
route_enumeration_enabled: false
route_enumeration_rc_threshold: 0.25
route_enumeration_max_routes: 1200
persistent_rmp_enabled: false

restricted_master_heuristic_enabled: true
restricted_master_time_limit: 20.0
restricted_master_max_routes: 4000
restricted_master_max_calls: 20
restricted_master_max_depth: 3
restricted_master_schedule_aware: true
restricted_master_max_no_good_rounds: 20
restricted_master_route_pack_conflict_max_events: 2
restricted_master_repair_enabled: true
restricted_master_repair_max_attempts: 3
restricted_master_repair_max_states: 50000

branching_strategy: 3pb
three_pb_pseudocost_candidates: 6
three_pb_fractional_candidates: 6
three_pb_lp_candidates: 3
three_pb_heuristic_cg_iterations: 3
three_pb_heuristic_routes_per_iter: 50
three_pb_heuristic_max_labels: 800
three_pb_candidate_budget_enabled: false

task_vehicle_linking_enabled: true
robust_capacity_cuts_enabled: true
robust_capacity_cut_max_depth: 0
robust_capacity_cut_max_subset_size: 5
robust_capacity_cut_max_per_round: 20
robust_capacity_cut_min_violation: 1.0e-5
robust_capacity_cut_max_rounds_per_node: 3
resource_lower_bound_cuts_enabled: true
resource_cut_max_depth: 0
resource_cut_max_subset_size: 6
resource_cut_max_per_round: 20
resource_cut_min_violation: 1.0e-5
resource_cut_max_rounds_per_node: 3
subset_row_cuts_enabled: true
subset_row_cut_max_depth: 0
subset_row_cut_max_subset_size: 8
subset_row_cut_max_per_round: 20
subset_row_cut_min_violation: 1.0e-5
subset_row_cut_max_rounds_per_node: 3
subset_row_candidate_top_routes: 80
subset_row_candidate_max_sets: 500
subset_row_k_values: [2, 3]
lm_rank1_cuts_enabled: true
lm_rank1_cut_max_depth: 0
lm_rank1_cut_max_subset_size: 8
lm_rank1_cut_max_per_round: 20
lm_rank1_cut_min_violation: 1.0e-5
lm_rank1_cut_max_rounds_per_node: 3
lm_rank1_candidate_top_routes: 100
lm_rank1_candidate_max_sets: 700
lm_rank1_denominators: [3, 4]
lm_rank1_memory_size: 4
lm_rank1_max_patterns_per_set: 12

schedule_subset_cost_cuts_enabled: false
schedule_capacity_cuts_enabled: true
schedule_capacity_separation_enabled: false
schedule_capacity_cut_max_depth: 0
schedule_capacity_cut_max_subset_size: 10
schedule_capacity_cut_max_per_round: 20
schedule_capacity_cut_min_violation: 1.0e-5
schedule_capacity_cut_max_rounds_per_node: 3
schedule_capacity_oracle_max_states: 200000
schedule_capacity_candidate_top_tasks: 12
schedule_capacity_candidate_max_combinations: 300
schedule_capacity_route_union_top_routes: 8
schedule_capacity_route_union_max_routes: 4
fleet_lower_bound_cuts_enabled: false

schedule_incompatibility_cuts_enabled: true
schedule_incompatibility_cut_max_depth: 2
schedule_incompatibility_cut_max_rounds_per_node: 2
schedule_incompatibility_cut_max_support_routes: 80
schedule_incompatibility_cut_max_per_round: 10
schedule_incompatibility_cut_min_violation: 5.0e-2
schedule_incompatibility_clique_min_size: 3
schedule_incompatibility_clique_seed_count: 24
route_set_schedule_packing_cuts_enabled: true
route_set_schedule_packing_cut_max_depth: 2
route_set_schedule_packing_cut_max_rounds_per_node: 2
route_set_schedule_packing_cut_max_support_routes: 40
route_set_schedule_packing_cut_max_routes: 16
route_set_schedule_packing_cut_max_per_round: 5
route_set_schedule_packing_cut_min_violation: 5.0e-2
route_set_schedule_packing_oracle_max_states: 200000
route_set_schedule_packing_roi_guard_enabled: true
route_set_schedule_packing_stop_after_no_add_rounds: 1
route_set_schedule_packing_min_objective_improvement: 1.0e-7
route_set_schedule_packing_stop_after_no_improve_rounds: 2
route_set_schedule_packing_global_time_limit_ratio: 0.10

# 这两个组件在 bench_20_01 已经证明没有收益或会扰动分支，fast20 restart 试验里先关掉。
weighted_route_schedule_packing_cuts_enabled: false
task_schedule_capacity_cuts_enabled: false
root_schedule_capacity_cuts_enabled: false

# Exact-safe local RMP restart。全局 route pool 不删除；被省略列可由 exact pricing 重新生成。
route_pool_restart_enabled: true
route_pool_restart_max_routes: 1800
route_pool_restart_min_global_routes: 2200
route_pool_restart_keep_recent_rounds: 2
route_pool_restart_max_routes_per_task_set: 4
route_pool_restart_active_value_tol: 1.0e-8
route_pool_restart_keep_cut_signatures: false
route_pool_restart_cleanup_enabled: false

schedule_pack_diagnostic_enabled: false
schedule_pack_relaxation_enabled: false
schedule_pack_full_pricing_enabled: false
schedule_pack_adaptive_enabled: false
route_enumeration_adaptive_enabled: false

cut_purge_age: 20
cut_purge_slack: 1.0e-5
cut_purge_dual: 1.0e-8
schedule_nogood_purge_enabled: true
schedule_nogood_purge_age: 8
schedule_nogood_purge_slack: 1.0e-4
schedule_nogood_purge_dual: 1.0e-8

rmp_params:
  display/verblevel: 0
  randomization/randomseedshift: 20260511
  randomization/permutationseed: 20260511
  randomization/lpseed: 20260511
  parallel/maxnthreads: 1
  presolving/maxrounds: 0
  separating/maxrounds: 0
