instance_dir: '.'
time_limit: 30.0
max_nodes: 30
journey_max_nodes: 30
max_cg_iterations: 50
phase1_enabled: True
pricing_eps: 1e-06
integer_tol: 1e-06
time_bucket_size: 10.0
pricing_start_time_step: 10.0
initial_single_task_starts_per_task: 3
initial_composite_seed_enabled: True
initial_composite_seed_max_sequences: 1000
initial_composite_seed_max_timed_evaluations: 0
initial_composite_seed_max_trips: 700
initial_composite_seed_cover_bonus: 1000.0
initial_composite_seed_top_tasks: 5
initial_composite_seed_time_limit: 3.0
initial_composite_seed_selection_mode: 'diverse'
initial_composite_seed_path_combinations: 0
initial_composite_seed_path_dominance_enabled: True
initial_savings_seed_enabled: True
