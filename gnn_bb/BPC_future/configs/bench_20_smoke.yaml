# BPC_future bench_20 smoke config. This is a plumbing smoke, not a
# paper-grade 20-task exact proof config. Python grid pricing is intentionally
# capped and may return PRICING_INCOMPLETE.
instances: ["bench_20_01", "bench_20_02"]
instance_dir: "branchpricecut/results/benchmark/20260523_bpc_clean_rim_repair_10_20_all/instances"
time_limit: 3600
max_nodes: 1000
max_cg_iterations: 100
phase1_enabled: true
pricing_eps: 1.0e-6
integer_tol: 1.0e-6
time_bucket_size: 1.0
initial_single_task_starts_per_task: 4
max_tasks_per_trip: 3
heuristic_top_tasks: 10
heuristic_max_sequences: 1000
heuristic_max_timed_evaluations: 40000
heuristic_pricing_time_limit: 1.0
heuristic_pricing_max_rounds: 10
heuristic_pricing_selection_mode: "diverse"
heuristic_max_path_combinations_per_sequence: 0
heuristic_path_dominance_enabled: true
heuristic_negative_trips_per_sequence: 2
exact_max_sequences: 5000
exact_max_timed_evaluations: 120000
exact_pricing_time_limit: 3.0
exact_pricing_selection_mode: "reduced_cost"
exact_max_path_combinations_per_sequence: 0
exact_path_dominance_enabled: false
exact_pricing_stop_after_first_add: true
exact_stop_after_negative_trips: 40
exact_negative_trips_per_sequence: 3
max_trips_per_pricing: 80
pool_integer_heuristic_enabled: true
pool_integer_heuristic_frequency: 4
pool_integer_heuristic_min_columns: 0
pool_integer_time_limit: 5.0
results_csv: "BPC_future/results/bpc_future_bench_20_smoke.csv"
log_dir: "BPC_future/results/logs/bench_20_smoke"
solution_dir: "BPC_future/results/solutions/bench_20_smoke"
