journey_learning_checkpoint_path: 'BPC_future/data/learning_dual/hardtail_20260604/hierarchical_option_gat_hardtail.pt'
journey_learning_device: 'cpu'
journey_learning_alpha_init: 0.8
journey_learning_alpha_min_active: 0.2
