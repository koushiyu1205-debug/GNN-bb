# Level 1 learning dual anchor.  This 20-task config uses the current 5/10
# hard-tail checkpoint as an exact-safe early column-search prior only.  It is
# intentionally root-only and true-RC filtered because no 20-task dual-center
# labels are available yet.  Certificate-face heuristic pricing is allowed, but
# official certificate pricing still uses original SCIP/RMP duals.
