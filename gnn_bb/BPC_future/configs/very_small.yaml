# BPC_future self-contained trip-time master smoke config.
instances: ["very_small"]
instance_dir: "json/instances"
time_limit: 120
max_nodes: 100
max_cg_iterations: 50
phase1_enabled: true
pricing_eps: 1.0e-6
integer_tol: 1.0e-6
time_bucket_size: 1.0
max_tasks_per_trip: 0
heuristic_top_tasks: 4
heuristic_max_sequences: 100
heuristic_max_timed_evaluations: 5000
heuristic_pricing_selection_mode: "diverse"
heuristic_max_path_combinations_per_sequence: 0
heuristic_path_dominance_enabled: true
exact_max_sequences: 0
exact_max_timed_evaluations: 0
exact_pricing_selection_mode: "reduced_cost"
exact_max_path_combinations_per_sequence: 0
exact_path_dominance_enabled: false
max_trips_per_pricing: 100
pool_integer_heuristic_enabled: true
pool_integer_heuristic_frequency: 3
pool_integer_heuristic_min_columns: 0
pool_integer_time_limit: 5.0
results_csv: "BPC_future/results/bpc_future_very_small.csv"
log_dir: "BPC_future/results/logs/very_small"
solution_dir: "BPC_future/results/solutions/very_small"
